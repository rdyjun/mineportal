plugins {
    id 'application'
    id 'com.gradleup.shadow' version '9.1.0'
    id 'com.diffplug.spotless' version '8.10.4'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.mineportal'
version = '1.1.0'

javafx {
    version = '21.0.13'
    modules = ['javafx.controls', 'javafx.web']
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
    // MCProtocolLib is published here (GeyserMC / OpenCollab)
    maven { url 'https://repo.opencollab.dev/main/' }
    maven { url 'https://repo.opencollab.dev/maven-snapshots/' }
    // MinecraftAuth and its net.lenni0451 dependencies
    maven { url 'https://maven.lenni0451.net/releases' }
    // ViaVersion / ViaBackwards
    maven { url 'https://repo.viaversion.com' }
}

dependencies {
    // 서버(../server)와 같은 Java 17-compatible native codec을 사용한다.
    implementation 'org.geysermc.mcprotocollib:protocol:26.1-SNAPSHOT'
    implementation 'net.raphimc:MinecraftAuth:4.1.1'
    implementation 'net.kyori:adventure-text-serializer-plain:4.17.0'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    // 26.1이 아닌 서버(예: 1.20.1 모드팩)와 통신하기 위한 버전 번역 — ViaTranslation 참고.
    implementation 'com.viaversion:viaversion-common:5.12.2'
    implementation 'com.viaversion:viabackwards-common:5.12.2'
    implementation 'com.google.guava:guava:33.4.8-jre' // ViaVersion 런타임 의존성

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

sourceSets {
    main.java.srcDir '../shared/src/main/java'
    test.java.srcDir '../shared/src/test/java'
}

tasks.named('test') {
    useJUnitPlatform()
}

application {
    mainClass = 'com.mineportal.Main'
}

spotless {
    java {
        target 'src/**/*.java', '../shared/src/**/*.java'
        googleJavaFormat('1.28.0')
        formatAnnotations()
    }
}

// The version string the running app reports (used for update checks).
// Kept in sync with the project version above.
tasks.named('processResources') {
    inputs.property('appVersion', project.version)
    filesMatching('version.properties') {
        expand(appVersion: project.version)
    }
    // 채팅 번역 렌더링용 언어 파일 — 백엔드(../server)와 동일한 것을 그대로 가져다 쓴다
    // (McConnectionManager와 동일한 시스템 메시지 번역 결과를 내기 위함).
    from('../server/src/main/resources/lang') {
        into 'lang'
    }
}

tasks.named('shadowJar') {
    archiveBaseName.set('mineportal-client')
    archiveClassifier.set('')
    archiveVersion.set('')
    // Merge service files so SLF4J / others resolve correctly in the fat jar.
    mergeServiceFiles()
}

// Make `build` produce the fat jar.
tasks.named('build') {
    dependsOn 'shadowJar'
}
