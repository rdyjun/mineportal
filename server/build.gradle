plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.diffplug.spotless' version '8.10.4'
}

// Boot 4.1.2 manages Netty 4.2.19.Final. 4.2.20.Final is the current 4.2 security patch.
ext['netty.version'] = '4.2.20.Final'

group = 'com.mineportal'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    // MCProtocolLib is published here (GeyserMC / OpenCollab)
    maven { url 'https://repo.opencollab.dev/main/' }
    maven { url 'https://repo.opencollab.dev/maven-snapshots/' }
    // MinecraftAuth and its net.lenni0451 dependencies
    maven { url 'https://maven.lenni0451.net/releases' }
    // ViaVersion / ViaBackwards
    maven { url 'https://repo.viaversion.com' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Version comes from the Spring Boot BOM (42.7.14 on Boot 4.1.2). An explicit
    // older pin here overrides that BOM and kept the driver on 42.7.4.
    runtimeOnly 'org.postgresql:postgresql'

    // Keep the Java 17-compatible native codec. ViaVersion/ViaBackwards 5.12.2 translates
    // between this 26.1 codec and both older servers and the observed 26.2/26.3 servers.
    implementation 'org.geysermc.mcprotocollib:protocol:26.1-SNAPSHOT'
    implementation 'net.raphimc:MinecraftAuth:4.1.1'
    implementation 'net.kyori:adventure-text-serializer-plain:4.17.0'
    // 26.1이 아닌 서버(예: 1.20.1 모드팩)와 통신하기 위한 버전 번역 — ViaTranslation 참고.
    implementation 'com.viaversion:viaversion-common:5.12.2'
    implementation 'com.viaversion:viabackwards-common:5.12.2'
    implementation 'com.google.guava:guava:33.4.8-jre' // ViaVersion 런타임 의존성
    implementation 'com.google.code.gson:gson:2.11.0' // shared status probe used by the desktop path

    // Let Spring Boot's dependency management keep every JUnit Platform module aligned.
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main.java.srcDir '../shared/src/main/java'
    test.java.srcDir '../shared/src/test/java'
}

tasks.named('test') {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/**/*.java', '../shared/src/**/*.java'
        googleJavaFormat('1.28.0')
        formatAnnotations()
    }
}

tasks.named('bootJar') {
    archiveFileName.set('app.jar')
}

// The web frontend lives in ../client (outside this Gradle project) so it can be built and
// deployed independently of the server; pull it into the jar's static resources here.
tasks.named('processResources') {
    from('../client') {
        into 'static'
    }
}
