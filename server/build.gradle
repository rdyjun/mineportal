plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mineportal'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    // MCProtocolLib is published here (GeyserMC / OpenCollab)
    maven { url 'https://repo.opencollab.dev/main/' }
    // MinecraftAuth and its net.lenni0451 dependencies
    maven { url 'https://maven.lenni0451.net/releases' }
    // ViaVersion / ViaBackwards
    maven { url 'https://repo.viaversion.com' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    runtimeOnly 'org.postgresql:postgresql:42.7.4'

    // 26.1-SNAPSHOT to speak the protocol version real 26.1.x servers (Minecraft's current
    // calendar-based versioning) actually expect — 1.21.7-1 only understood the old scheme
    // and got "Outdated client!" rejected by anything running 26.x.
    implementation 'org.geysermc.mcprotocollib:protocol:26.1-SNAPSHOT'
    implementation 'net.raphimc:MinecraftAuth:4.1.1'
    implementation 'net.kyori:adventure-text-serializer-plain:4.17.0'
    // 26.1이 아닌 서버(예: 1.20.1 모드팩)와 통신하기 위한 버전 번역 — ViaTranslation 참고.
    implementation 'com.viaversion:viaversion-common:5.12.0'
    implementation 'com.viaversion:viabackwards-common:5.12.0'
    implementation 'com.google.guava:guava:33.4.8-jre' // ViaVersion 런타임 의존성
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName.set('app.jar')
}

// The web frontend lives in ../client (outside this Gradle project) so it can be built and
// deployed independently of the server; pull it into the jar's static resources here.
tasks.named('processResources') {
    from('../client') {
        into 'static'
    }
}
