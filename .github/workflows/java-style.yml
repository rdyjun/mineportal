name: Java style

on:
  pull_request:
    paths:
      - 'server/**'
      - 'desktop-client/**'
      - 'shared/**'
      - '.github/workflows/java-style.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: java-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check backend and shared Java formatting
        working-directory: server
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck --no-daemon
      - name: Check headless agent Java formatting
        working-directory: desktop-client
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck --no-daemon
