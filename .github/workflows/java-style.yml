name: Java style

on:
  pull_request:
    paths:
      - 'server/**'
      - 'desktop-client/**'
      - 'demo-server/**'
      - 'shared/**'
      - 'config/checkstyle/**'
      - '.github/workflows/java-style.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: java-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check backend and shared Java style
        working-directory: server
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck checkstyleMain checkstyleTest --no-daemon
      - name: Check headless agent Java style
        working-directory: desktop-client
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck checkstyleMain checkstyleTest --no-daemon
      - name: Check demo server Java style
        working-directory: demo-server
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck checkstyleMain checkstyleTest --no-daemon
