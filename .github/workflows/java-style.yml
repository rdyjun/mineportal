name: Java style

on:
  pull_request:
    paths:
      - 'server/**'
      - 'desktop-client/**'
      - 'shared/**'
      - '.github/workflows/java-style.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: java-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  spotless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Check backend and shared Java formatting
        working-directory: server
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck --no-daemon
      - name: Check headless agent Java formatting
        working-directory: desktop-client
        run: |
          chmod +x gradlew
          ./gradlew spotlessCheck --no-daemon
