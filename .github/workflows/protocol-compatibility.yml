name: Protocol compatibility

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  java-and-model-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Test and package backend
        working-directory: server
        run: |
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon
      - name: Test and package headless desktop agent
        working-directory: desktop-client
        run: |
          chmod +x gradlew
          ./gradlew test shadowJar --no-daemon
      - name: Model-check connection lifecycle
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/tla2tools.jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check --strict
          java -jar "$RUNNER_TEMP/tla2tools.jar" -workers auto \
            -config formal/ProtocolConnection.cfg formal/ProtocolConnection.tla
