name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: FORCE_REBUILD
          script: |
            set -e
            cd /opt/mc-chat-viewer
            OLD_SHA=$(git rev-parse HEAD)
            git fetch origin main
            git reset --hard origin/main
            NEW_SHA=$(git rev-parse HEAD)

            # client/는 컨테이너에 bind mount돼있어(docker-compose.yml) git reset만으로 이미
            # 최신 파일이 반영되므로, 백엔드/빌드 관련 경로가 안 바뀐 프론트 전용 커밋은
            # jar 재빌드나 컨테이너 재시작 없이 여기서 끝난다.
            if [ "$FORCE_REBUILD" = "1" ]; then
              echo "Manually triggered — forcing full rebuild"
              REBUILD=1
            elif [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "No new commits — nothing to do"
              REBUILD=0
            elif git diff --name-only "$OLD_SHA" "$NEW_SHA" | grep -qE '^(server/|docker-compose\.yml$)'; then
              echo "Backend/build files changed — rebuilding"
              REBUILD=1
            else
              echo "Frontend-only change — static files already updated via bind mount, skipping rebuild"
              REBUILD=0
            fi

            if [ "$REBUILD" = "1" ]; then
              docker compose --env-file server/.env up -d --build
              READY=0
              for attempt in $(seq 1 30); do
                if docker logs mineportal 2>&1 | grep -q "Started MineportalServerApplication"; then
                  READY=1
                  break
                fi
                sleep 2
              done
              if [ "$READY" != "1" ]; then
                echo "mineportal did not become ready"
                docker compose --env-file server/.env ps
                docker logs --tail 200 mineportal
                exit 1
              fi
              docker compose --env-file server/.env ps
              if [ -x /usr/sbin/nginx ]; then
                sudo -n /usr/sbin/nginx -t
                sudo -n /usr/sbin/nginx -s reload
              fi
              docker image prune -f
            fi
      - name: Verify public endpoint
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error https://mineportal.kr/ >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "mineportal.kr did not become reachable"
          exit 1
