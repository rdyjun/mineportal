name: JavaScript style

on:
  pull_request:
    paths:
      - 'client/**'
      - 'toss-client/**'
      - 'formal/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.mjs'
      - 'prettier.config.mjs'
      - '.prettierignore'
      - '.editorconfig'
      - 'docs/code-style.md'
      - '.github/workflows/js-style.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: js-style-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eslint-prettier:
    name: ESLint and Prettier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Check JavaScript and TypeScript
        run: |
          npm ci
          npm run check
